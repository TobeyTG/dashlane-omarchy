name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q shellcheck jq
      - run: shellcheck -x bin/* install.sh uninstall.sh test/test.sh test/fake/dcli
      - run: test/test.sh   # clipboard assertions are skipped without a Wayland session
